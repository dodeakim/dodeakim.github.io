<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dodeakim</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1a1a1a; --muted: #6b7280; --line: #e5e7eb; --link: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111214; --fg: #e8e8e8; --muted: #9ca3af; --line: #2a2c30; --link: #7aa7ff; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, "Noto Sans KR", sans-serif;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 72px 24px 96px; }
  header { display: flex; gap: 20px; align-items: center; margin-bottom: 40px; }
  /* 사진 넣을 때: 아래 div를 <img class="avatar" src="avatar.jpg" alt=""> 로 교체 */
  .avatar { width: 88px; height: 88px; border-radius: 50%; flex: none; background: var(--line); object-fit: cover; }
  h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .tagline { color: var(--muted); margin: 0; }
  .links { margin-top: 10px; display: flex; gap: 14px; flex-wrap: wrap; font-size: 14px; }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--muted); margin: 40px 0 12px; padding-bottom: 8px;
    border-bottom: 1px solid var(--line);
  }
  .item { margin-bottom: 18px; }
  .item .title { font-weight: 600; }
  .item .meta { color: var(--muted); font-size: 14px; }
  footer { margin-top: 64px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="avatar"></div>
    <div>
      <h1>Your Name</h1>
      <p class="tagline">One-line description</p>
      <div class="links">
        <a href="mailto:you@example.com">Email</a>
        <a href="https://github.com/dodeakim">GitHub</a>
        <a href="https://scholar.google.com/">Scholar</a>
      </div>
    </div>
  </header>

  <section>
    <h2>About</h2>
    <p>TBD</p>
  </section>

  <section>
    <h2>Publications</h2>
    <div class="item">
      <div class="title">Paper title</div>
      <div class="meta">Authors · Venue, Year · <a href="#">paper</a> · <a href="#">code</a></div>
    </div>
  </section>

  <section>
    <h2>Experience</h2>
    <div class="item">
      <div class="title">Position, Organization</div>
      <div class="meta">2020 – Present</div>
    </div>
  </section>

  <footer>© <span id="y"></span></footer>

</div>
<script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
